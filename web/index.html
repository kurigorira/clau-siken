<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検3級 単語トレーニング</title>
<style>
  :root{
    --bg:#0f1524; --bg2:#141c30; --card:#1b2540; --ink:#eaf0ff; --muted:#93a1c4;
    --line:#2a3556; --accent:#5b8cff; --accent2:#7c5cff; --ok:#2ee6a6; --ng:#ff6b81;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#eef2fb;--bg2:#ffffff;--card:#ffffff;--ink:#1c2440;--muted:#6a76a0;
      --line:#e2e8f6;--accent:#4a6fff;--accent2:#7c5cff;--ok:#12b886;--ng:#f0546b;--shadow:0 8px 24px rgba(40,60,120,.12)}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 70px}
  header.top{text-align:center;padding:12px 0 2px}
  header.top h1{font-size:1.3rem;margin:.1em 0;letter-spacing:.02em}
  header.top .tag{color:var(--muted);font-size:.85rem}
  /* 進捗 */
  .overall{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;box-shadow:var(--shadow)}
  .overall .lbl{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .bar{height:12px;border-radius:99px;background:rgba(130,150,200,.18);overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s}
  /* メニュー */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 14px;text-align:center;
    cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,border-color .15s}
  .tile:hover{transform:translateY(-2px);border-color:var(--accent)}
  .tile:active{transform:translateY(0)}
  .tile .ic{font-size:2.4rem;line-height:1}
  .tile .lb{font-weight:700;margin-top:9px}
  .tile .sub{color:var(--muted);font-size:.78rem;margin-top:3px}
  .tile.wide{grid-column:1/-1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
  .back{display:inline-flex;gap:6px;background:none;border:none;color:var(--accent);font-size:1rem;cursor:pointer;padding:8px 4px;margin-top:4px}
  h2.sec{font-size:1.1rem;margin:14px 4px 2px}
  .hint{color:var(--muted);font-size:.82rem;line-height:1.6}
  /* チップ選択 */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:8px 14px;
    font-size:.9rem;cursor:pointer;transition:all .12s}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .btn{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;
    padding:13px 20px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none}
  .btn.block{display:block;width:100%;margin-top:14px}
  /* クイズ */
  .qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.82rem}
  .prog{height:8px;background:rgba(130,150,200,.18);border-radius:99px;overflow:hidden;margin:10px 0}
  .prog>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .word{text-align:center;padding:18px 6px 6px}
  .word .en{font-size:2.3rem;font-weight:800;letter-spacing:.01em}
  .word .pos{display:inline-block;margin-top:8px;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
  .word .ja{font-size:1.7rem;font-weight:800}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .opt{text-align:left;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:1.05rem;
    color:var(--ink);cursor:pointer;transition:border-color .1s,background .1s}
  .opt:hover{border-color:var(--accent)}
  .opt.correct{border-color:var(--ok);background:rgba(46,230,166,.14)}
  .opt.wrong{border-color:var(--ng);background:rgba(255,107,129,.14)}
  .verdict{margin-top:14px;font-weight:800;font-size:1.1rem;text-align:center}
  .verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
  .next{margin-top:16px;text-align:center}
  /* フラッシュカード */
  .flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;user-select:none}
  .flash small{color:var(--muted);font-size:.8rem;margin-top:14px}
  .fbtns{display:flex;gap:10px;margin-top:14px}
  .fbtns .btn{flex:1}
  /* 結果 */
  .score{text-align:center;padding:8px 0}
  .score .big{font-size:2.8rem;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  /* テーブル(不規則動詞) */
  .tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
  .tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
  .tbl th{color:var(--muted);font-weight:600;font-size:.8rem}
  .tbl .en{font-weight:700}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000a;color:#fff;padding:10px 18px;
    border-radius:99px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;backdrop-filter:blur(6px)}
  .toast.show{opacity:1}
  footer{text-align:center;color:var(--muted);font-size:.76rem;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📗 英検3級 単語トレーニング</h1>
    <div class="tag">才弥さんの合格プロジェクト</div>
  </header>
  <div id="app"></div>
  <footer>コツコツ続けよう。毎日20語でも、続ければ大きな力に。</footer>
</div>
<div class="toast" id="toast"></div>

<script src="words.js"></script>
<script>
const DATA = window.EIKEN_DATA || {categories:[],irregular:[]};
// 全単語をフラットに（重複はenで排除）
const ALL=[];
{const seen=new Set();
 for(const c of DATA.categories)for(const w of c.words){if(seen.has(w.en))continue;seen.add(w.en);ALL.push(Object.assign({cat:c.name},w));}}
const CATS=DATA.categories.map(c=>c.name);
const IRR=DATA.irregular||[];

// ============ 進捗（localStorage）============
const PKEY="eiken3_progress_v1";
let PROG=(()=>{try{return JSON.parse(localStorage.getItem(PKEY))||{};}catch(e){return{};}})();
function saveProg(){localStorage.setItem(PKEY,JSON.stringify(PROG));}
function p(en){return PROG[en]||{s:0,m:false,w:false};}
function markRight(en){const o=p(en);o.s=(o.s||0)+1;if(o.s>=2){o.m=true;o.w=false;}PROG[en]=o;saveProg();}
function markWrong(en){const o=p(en);o.s=0;o.m=false;o.w=true;PROG[en]=o;saveProg();}
function masteredCount(){return ALL.filter(w=>p(w.en).m).length;}
function weakWords(){return ALL.filter(w=>p(w.en).w);}

// ============ ユーティリティ ============
const app=document.getElementById("app");
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(arr,n){return shuffle(arr).slice(0,n);}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1600);}
function backBtn(fn){return `<button class="back" onclick="${fn||'home()'}">← もどる</button>`;}

// ============ ホーム ============
function home(){
  const done=masteredCount(), total=ALL.length, pct=Math.round(done/total*100);
  const weak=weakWords().length;
  app.innerHTML=`
    <div class="overall">
      <div class="lbl"><span>覚えた単語</span><span>${done} / ${total} 語（${pct}%）</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="grid">
      <div class="tile" onclick="setup('en2ja')"><div class="ic">🎯</div><div class="lb">単語テスト</div><div class="sub">英語→意味（4択）</div></div>
      <div class="tile" onclick="setup('ja2en')"><div class="ic">🔤</div><div class="lb">意味→英語</div><div class="sub">日本語→英語（4択）</div></div>
      <div class="tile" onclick="setup('flash')"><div class="ic">🃏</div><div class="lb">フラッシュカード</div><div class="sub">めくって覚える</div></div>
      <div class="tile" onclick="irregular()"><div class="ic">📖</div><div class="lb">不規則動詞</div><div class="sub">変化を覚える（${IRR.length}語）</div></div>
      <div class="tile wide" onclick="startWeak()"><div class="ic">🔥</div><div class="lb">苦手な単語だけ復習</div><div class="sub">まちがえた ${weak} 語をもう一度</div></div>
    </div>
    <div class="card"><div class="hint">💡 使い方：まず「単語テスト」で挑戦 → まちがえた語は「苦手な単語だけ復習」で反復。正解を2回続けると「覚えた」に入ります。進捗はこの端末に自動保存されます。</div></div>`;
}

// ============ 出題設定 ============
let SETUP={mode:"en2ja",cat:"すべて",count:20};
function setup(mode){
  SETUP.mode=mode;SETUP.cat="すべて";
  const modeName={en2ja:"英語→意味",ja2en:"意味→英語",flash:"フラッシュカード"}[mode];
  let chips=`<button class="chip on" data-cat="すべて" onclick="pickCat(this)">すべて(${ALL.length})</button>`;
  for(const c of DATA.categories)chips+=`<button class="chip" data-cat="${esc(c.name)}" onclick="pickCat(this)">${esc(c.name)}(${c.words.length})</button>`;
  const counts=[10,20,30,50,"すべて"];
  let cchips="";counts.forEach((n,i)=>{cchips+=`<button class="chip ${n===20?'on':''}" data-cnt="${n}" onclick="pickCnt(this)">${n===''+n?n:n}${n==='すべて'?'':'語'}</button>`;});
  app.innerHTML=backBtn()+`
    <h2 class="sec">${modeName}</h2>
    <div class="card">
      <div class="hint">分野をえらぶ</div>
      <div class="chips" id="catchips">${chips}</div>
      <div class="hint" style="margin-top:14px">出題数</div>
      <div class="chips" id="cntchips">${cchips}</div>
      <button class="btn block" onclick="startQuiz()">スタート ▶</button>
    </div>`;
}
function pickCat(el){document.querySelectorAll("#catchips .chip").forEach(c=>c.classList.remove("on"));el.classList.add("on");SETUP.cat=el.dataset.cat;}
function pickCnt(el){document.querySelectorAll("#cntchips .chip").forEach(c=>c.classList.remove("on"));el.classList.add("on");SETUP.cnt=el.dataset.cnt;SETUP.count=el.dataset.cnt;}

function poolFor(cat){
  if(cat==="すべて")return ALL.slice();
  const c=DATA.categories.find(x=>x.name===cat);
  return c?c.words.map(w=>Object.assign({cat:cat},w)):ALL.slice();
}

// ============ クイズ本体 ============
let QZ=null;
function startQuiz(){
  const pool=poolFor(SETUP.cat);
  let n=SETUP.count;if(n==="すべて"||n===undefined)n=pool.length;else n=Math.min(parseInt(n,10),pool.length);
  const items=sample(pool,n);
  if(SETUP.mode==="flash")return startFlash(items);
  QZ={mode:SETUP.mode,items,i:0,correct:0,wrong:[],answered:false};
  renderQ();
}
function startWeak(){
  const weak=weakWords();
  if(weak.length===0){toast("苦手な単語はありません👍");return;}
  QZ={mode:"en2ja",items:shuffle(weak),i:0,correct:0,wrong:[],answered:false};
  renderQ();
}
function renderQ(){
  const {items,i,mode}=QZ;
  if(i>=items.length)return renderResult();
  const w=items[i];
  const en2ja=(mode==="en2ja");
  // 選択肢作成（同分野からダミー、足りなければ全体から）
  const poolSame=poolFor(w.cat).filter(x=>x.ja!==w.ja&&x.en!==w.en);
  const pool=poolSame.length>=3?poolSame:ALL.filter(x=>x.ja!==w.ja&&x.en!==w.en);
  const distract=sample(pool,3);
  const opts=shuffle([w,...distract]);
  let body=backBtn()+`<div class="card">
    <div class="qhead"><span>${esc(w.cat)}</span><span>第 ${i+1} / ${items.length} 問</span></div>
    <div class="prog"><i style="width:${i/items.length*100}%"></i></div>
    <div class="word"><div class="en">${esc(en2ja?w.en:w.ja)}</div>${en2ja?`<div class="pos">${esc(w.pos)}</div>`:""}</div>
    <div class="opts" id="opts">`;
  opts.forEach((o,idx)=>{body+=`<button class="opt" data-en="${esc(o.en)}" onclick="answer('${esc(o.en).replace(/'/g,"\\'")}')">${esc(en2ja?o.ja:o.en)}</button>`;});
  body+=`</div><div id="res"></div></div>`;
  app.innerHTML=body;
}
function answer(en){
  if(QZ.answered)return;QZ.answered=true;
  const w=QZ.items[QZ.i];const ok=(en===w.en);
  if(ok){QZ.correct++;markRight(w.en);}else{QZ.wrong.push(w);markWrong(w.en);}
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.style.pointerEvents="none";
    if(b.dataset.en===w.en)b.classList.add("correct");
    else if(b.dataset.en===en)b.classList.add("wrong");
  });
  const en2ja=(QZ.mode==="en2ja");
  document.getElementById("res").innerHTML=`
    <div class="verdict ${ok?'ok':'ng'}">${ok?"⭕ 正解！":"❌ 正解は「"+esc(en2ja?w.ja:w.en)+"」"}</div>
    <div class="next"><button class="btn" onclick="nextQ()">${QZ.i+1>=QZ.items.length?"結果を見る →":"次へ →"}</button></div>`;
}
function nextQ(){QZ.i++;QZ.answered=false;renderQ();}
function renderResult(){
  const {items,correct,wrong}=QZ;const pct=Math.round(correct/items.length*100);
  let msg=pct===100?"🎉 全問正解！すばらしい！":pct>=80?"👍 よくできました！":"📚 復習でしっかり定着させよう。";
  let body=backBtn()+`<div class="card score">
    <div class="big">${correct} / ${items.length}</div>
    <div style="color:var(--muted)">正答率 ${pct}%</div>
    <div style="margin-top:8px">${esc(msg)}</div>`;
  if(wrong.length){
    body+=`<button class="btn block" onclick="retryWrong()">まちがえた ${wrong.length} 語をもう一度</button>`;
  }
  body+=`<button class="btn ghost block" onclick="home()">ホームへ</button></div>`;
  if(wrong.length){
    body+=`<div class="card"><h2 class="sec" style="margin-top:0">まちがえた単語</h2>`;
    for(const w of wrong)body+=`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(w.en)}</b> <span style="color:var(--muted)">${esc(w.pos)}</span> … ${esc(w.ja)}</div>`;
    body+=`</div>`;
  }
  app.innerHTML=body;
}
function retryWrong(){QZ={mode:QZ.mode,items:shuffle(QZ.wrong),i:0,correct:0,wrong:[],answered:false};renderQ();}

// ============ フラッシュカード ============
let FC=null;
function startFlash(items){FC={items,i:0,flipped:false};renderFlash();}
function renderFlash(){
  const {items,i,flipped}=FC;
  if(i>=items.length){app.innerHTML=backBtn()+`<div class="card score"><div class="big">おわり！</div><div style="margin-top:8px">${items.length}枚を確認しました。</div><button class="btn ghost block" onclick="home()">ホームへ</button></div>`;return;}
  const w=items[i];
  app.innerHTML=backBtn()+`<div class="card">
    <div class="qhead"><span>${esc(w.cat)}</span><span>${i+1} / ${items.length}</span></div>
    <div class="flash" onclick="flip()">
      <div class="en" style="font-size:2.2rem;font-weight:800">${esc(w.en)}</div>
      <div class="pos">${esc(w.pos)}</div>
      ${flipped?`<div class="ja" style="margin-top:14px">${esc(w.ja)}</div>`:`<small>タップで意味を表示</small>`}
    </div>
    <div class="fbtns">
      <button class="btn ghost" onclick="fcMark(false)">まだ</button>
      <button class="btn" onclick="fcMark(true)">覚えた</button>
    </div>
    <div class="hint" style="text-align:center;margin-top:10px">カードをタップすると答えが出ます</div>
  </div>`;
}
function flip(){FC.flipped=!FC.flipped;renderFlash();}
function fcMark(ok){const w=FC.items[FC.i];if(ok)markRight(w.en);else markWrong(w.en);FC.i++;FC.flipped=false;renderFlash();}

// ============ 不規則動詞 ============
function irregular(){
  let body=backBtn()+`<div class="card">
    <h2 class="sec" style="margin-top:0">📖 不規則動詞の変化（${IRR.length}語）</h2>
    <div class="hint">原形 → 過去形 → 過去分詞。声に出して覚えよう。クイズで確認も。</div>
    <button class="btn block" onclick="startIrrQuiz()">変化テストに挑戦 ▶</button>
    <table class="tbl"><tr><th>原形</th><th>過去形</th><th>過去分詞</th><th>意味</th></tr>`;
  for(const v of IRR)body+=`<tr><td class="en">${esc(v.base)}</td><td>${esc(v.past)}</td><td>${esc(v.pp)}</td><td style="color:var(--muted)">${esc(v.ja)}</td></tr>`;
  body+=`</table></div>`;
  app.innerHTML=body;
}
let IQ=null;
function startIrrQuiz(){IQ={items:sample(IRR,Math.min(15,IRR.length)),i:0,correct:0,flipped:false};renderIrrQ();}
function renderIrrQ(){
  const {items,i,flipped}=IQ;
  if(i>=items.length){app.innerHTML=backBtn("irregular()")+`<div class="card score"><div class="big">${IQ.correct} / ${items.length}</div><div style="margin-top:8px">おつかれさま！</div><button class="btn block" onclick="startIrrQuiz()">もう一度</button><button class="btn ghost block" onclick="irregular()">一覧にもどる</button></div>`;return;}
  const v=items[i];
  app.innerHTML=backBtn("irregular()")+`<div class="card">
    <div class="qhead"><span>不規則動詞</span><span>${i+1} / ${items.length}</span></div>
    <div class="flash" onclick="flipIrr()">
      <div class="en" style="font-size:2rem;font-weight:800">${esc(v.base)}</div>
      <div class="pos">${esc(v.ja)}</div>
      ${flipped?`<div class="ja" style="margin-top:14px;font-size:1.4rem">${esc(v.past)} / ${esc(v.pp)}</div>`:`<small>タップで変化を表示（過去形 / 過去分詞）</small>`}
    </div>
    <div class="fbtns">
      <button class="btn ghost" onclick="irrMark(false)">まちがえた</button>
      <button class="btn" onclick="irrMark(true)">言えた</button>
    </div>
  </div>`;
}
function flipIrr(){IQ.flipped=!IQ.flipped;renderIrrQ();}
function irrMark(ok){if(ok)IQ.correct++;IQ.i++;IQ.flipped=false;renderIrrQ();}

home();
</script>
</body>
</html>
